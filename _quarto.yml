project:
  type: website
  output-dir: _site

website:
  title: "Text Mining Systematic Reviews"
  description: "A pre-conference workshop on bulk paper downloading and evidence-based causal knowledge extraction. September 30, 2026 · Tilburg, Netherlands."
  site-url: https://rasoulnorouzi.github.io/causal-km-workshop
  repo-url: https://github.com/rasoulnorouzi/causal-km-workshop
  repo-actions: [edit, issue]
  open-graph: true

  navbar:
    background: "#1B3A6B"
    foreground: "white"
    title: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "Schedule"
        href: schedule.qmd
      - text: "Materials"
        href: materials.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/rasoulnorouzi/causal-km-workshop
        aria-label: GitHub

  sidebar: false

  page-footer:
    left: "Rasoul Norouzi · Tilburg University · 2026"
    right:
      - icon: github
        href: https://github.com/rasoulnorouzi/causal-km-workshop

  cookie-consent: false

format:
  html:
    theme:
      - flatly
      - assets/custom.scss
    highlight-style: github
    toc: true
    toc-depth: 2
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
